<!doctype html>
<html lang="zh-CN">

  <style>
    :root{--ink:#26343a;--muted:#7b858a;--line:#e9e6df;--paper:#fbfaf7;--warm:#f2e9dc;--sage:#c8d8cc;--moss:#647d6e;--orange:#e1784c;--white:#fff;--shadow:0 16px 40px rgba(38,52,58,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit} .app{min-height:100vh;display:grid;grid-template-columns:250px 1fr;max-width:1500px;margin:auto}.sidebar{border-right:1px solid var(--line);padding:34px 22px 24px;display:flex;flex-direction:column;gap:34px}.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}.brand-mark{width:28px;height:28px;border-radius:10px 10px 10px 2px;background:var(--moss);position:relative}.brand-mark:after{content:"";position:absolute;width:9px;height:9px;background:#f6d7b4;border-radius:50%;top:6px;left:10px}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}.nav{display:grid;gap:8px}.nav button{padding:11px 13px;border-radius:12px;text-align:left;color:var(--muted);display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#eef3ef;color:var(--ink)}.nav .icon{font-size:18px;width:20px;text-align:center}.sync-card{background:#f2eee7;border-radius:18px;padding:15px;margin-top:auto}.sync-row{display:flex;align-items:center;gap:8px;font-weight:600}.dot{width:7px;height:7px;border-radius:50%;background:#7ca486}.sync-card p{font-size:12px;color:var(--muted);margin:9px 0 0}.main{padding:31px 5vw 50px;max-width:1140px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}.date-context{color:var(--muted);font-size:13px}.top-actions{display:flex;align-items:center;gap:12px}.round-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;background:white}.avatar{width:36px;height:36px;border-radius:50%;background:#dfc4a9;color:#705442;display:grid;place-items:center;font-weight:700}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:29px}.hero h1{font-size:34px;line-height:1.18;margin:5px 0 9px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted)}.new-btn{background:var(--ink);color:#fff;border-radius:14px;padding:13px 18px;display:flex;gap:9px;align-items:center;box-shadow:0 7px 14px #26343a18}.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.8fr);gap:22px}.panel{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.panel-title{font-weight:700;font-size:15px}.month-switch{display:flex;align-items:center;gap:8px}.month-switch button{width:28px;height:28px;border-radius:8px;color:var(--muted)}.month-switch button:hover{background:#f5f3ef}.month{font-weight:700;min-width:84px;text-align:center}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.weekday{text-align:center;font-size:11px;color:#a2a8ab;padding-bottom:3px}.day{min-height:54px;border-radius:12px;padding:7px 8px;position:relative;color:#7b858a}.day:not(.blank):hover{background:#f6f4ef}.day-num{font-size:12px}.day.has-entry{background:#f2f7f2;color:var(--ink);font-weight:600}.day.selected{background:var(--moss);color:#fff}.day .mark{width:5px;height:5px;border-radius:50%;background:var(--orange);position:absolute;bottom:9px;left:50%;transform:translateX(-50%)}.day.selected .mark{background:#f8d4ad}.entries{display:grid;gap:12px}.entry{border:1px solid var(--line);border-radius:16px;padding:15px;transition:.2s}.entry:hover{border-color:#cbd8ce;transform:translateY(-1px)}.entry-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:7px}.entry-title{font-weight:700;margin-bottom:4px}.entry-excerpt{font-size:13px;color:#6e777b;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.entry-foot{display:flex;justify-content:space-between;align-items:center;margin-top:11px}.tag{font-size:11px;padding:4px 8px;border-radius:99px;background:#f3ede5;color:#9a6d4d}.media-thumb{width:48px;height:34px;border-radius:7px;object-fit:cover;background:#e6dfd2}.empty{padding:30px 10px;text-align:center;color:var(--muted)}.mode-panel{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:20px;background:#eef3ef}.mode-copy p{margin:5px 0 0;color:var(--muted);font-size:12px}.mode-actions{display:flex;gap:8px}.mode-btn{padding:10px 13px;border-radius:11px;color:var(--muted);border:1px solid #d7e0d8;background:#fff}.mode-btn.active{background:var(--moss);color:#fff;border-color:var(--moss)}.backup-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.backup-actions button{font-size:12px;padding:8px 10px;border-radius:9px;border:1px solid var(--line)}.backup-actions button:hover{background:#faf8f4}.composer{grid-column:1/-1;display:grid;grid-template-columns:1fr 220px;gap:16px}.composer textarea{border:0;outline:0;resize:none;min-height:100px;width:100%;color:var(--ink);font-size:15px}.composer textarea::placeholder{color:#aab0b2}.composer-tools{border-left:1px solid var(--line);padding-left:18px;display:grid;gap:9px}.tool-btn{border:1px solid var(--line);border-radius:11px;padding:10px;text-align:left;color:var(--muted);font-size:12px}.tool-btn:hover{background:#faf8f4;color:var(--ink)}.record{background:#fff4ec;border-color:#f1dfd0;color:#bd6b42;display:flex;align-items:center;justify-content:center;gap:7px}.record.recording{background:#e88965;color:#fff}.save-btn{background:var(--moss);color:white;border-radius:11px;padding:10px;margin-top:auto}.file-input{display:none}.lock-screen{position:fixed;inset:0;background:#f6f1e9;z-index:20;display:grid;place-items:center}.lock-card{width:min(420px,calc(100% - 40px));background:#fff;border-radius:26px;padding:36px;box-shadow:var(--shadow);text-align:center}.lock-card h2{font-size:24px;margin:16px 0 7px}.lock-card p{color:var(--muted);margin:0 0 23px}.lock-input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;outline:none;margin-bottom:11px}.unlock{width:100%;background:var(--ink);color:#fff;padding:13px;border-radius:12px}.hint{font-size:11px;color:#a4abad;margin-top:14px}.modal{position:fixed;inset:0;display:none;place-items:center;background:#26343a50;z-index:10;padding:20px}.modal.show{display:grid}.modal-card{background:#fff;border-radius:22px;padding:25px;width:min(450px,100%);box-shadow:var(--shadow)}.modal-card h3{margin:0 0 16px}.modal-card label{font-size:12px;color:var(--muted);display:block;margin:12px 0 5px}.modal-card input{width:100%;border:1px solid var(--line);padding:11px;border-radius:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.secondary{padding:10px 14px;border:1px solid var(--line);border-radius:10px}.primary{padding:10px 14px;background:var(--moss);color:#fff;border-radius:10px}@media(max-width:800px){.app{display:block}.sidebar{position:sticky;top:0;z-index:5;height:auto;padding:14px 18px;border-right:0;border-bottom:1px solid var(--line);background:#fbfaf7;flex-direction:row;align-items:center;gap:18px}.sidebar .eyebrow,.sidebar .sync-card{display:none}.nav{display:flex;margin-left:auto}.nav button{padding:8px}.nav button span:not(.icon){display:none}.main{padding:24px 18px 40px}.topbar{margin-bottom:25px}.hero{align-items:start;gap:15px}.hero h1{font-size:28px}.new-btn{padding:11px 13px}.new-btn span{display:none}.layout{display:block}.panel{margin-bottom:16px;padding:17px}.calendar .day{min-height:45px;padding:6px}.mode-panel{display:block}.mode-actions{margin-top:14px}.composer{display:block}.composer-tools{border:0;border-top:1px solid var(--line);padding:14px 0 0;margin-top:12px;display:flex;flex-wrap:wrap}.tool-btn{flex:1;min-width:110px}.save-btn{width:100%}.entry{padding:13px}}
  </style>
</head>
<body>
  <div id="lockScreen" class="lock-screen"><div class="lock-card"><div class="brand" style="justify-content:center"><span class="brand-mark"></span><span>Quiet Pages</span></div><h2>欢迎回来</h2><p>你的生活，值得被温柔地记下。</p><input id="passwordInput" class="lock-input" type="password" placeholder="输入账户密码" autocomplete="current-password"><button id="unlockBtn" class="unlock">解锁我的日记</button><div class="hint">演示密码：1234 或 2468（任意一个都可进入）</div></div></div>
  <div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark"></span><span>Quiet Pages</span></div><div><div class="eyebrow">Your space</div><nav class="nav"><button class="active"><span class="icon">⌂</span><span>我的日记</span></button><button id="settingsBtn"><span class="icon">⚙</span><span>账户设置</span></button></nav></div><div class="sync-card"><div class="sync-row"><span class="dot"></span>已实时同步</div><p>手机 · 电脑 · 平板<br>刚刚同步完成</p></div></aside>
    <main class="main"><div class="topbar"><div class="date-context">星期六，2026年11月7日</div><div class="top-actions"><button class="round-btn" title="搜索">⌕</button><div class="avatar">Z</div></div></div><section class="hero"><div><div class="eyebrow">A little record of today</div><h1>把今天，留给未来的你。</h1><p>记录那些值得被记住的微小瞬间。</p></div><button id="newBtn" class="new-btn"><span>＋</span><span>写一篇日记</span></button></section>
      <div class="layout"><section class="panel calendar"><div class="panel-head"><div class="panel-title">日历回看</div><div class="month-switch"><button id="prevMonth">‹</button><span id="monthLabel" class="month">2026年11月</span><button id="nextMonth">›</button></div></div><div id="calendarGrid" class="calendar-grid"></div></section><section class="panel"><div class="panel-head"><div class="panel-title">最近记录</div><button id="allEntries" style="font-size:12px;color:var(--muted)">查看全部 →</button></div><div id="entries" class="entries"></div></section><section class="panel mode-panel"><div class="mode-copy"><div class="panel-title">存储模式</div><p id="modeHint">单端模式：只保存在本机，可随时导出加密备份。</p><div class="backup-actions"><button id="exportBtn">↓ 导出加密备份</button><button id="importBtn">↑ 导入备份</button><input id="backupInput" class="file-input" type="file" accept="application/json"></div></div><div class="mode-actions"><button class="mode-btn active" data-mode="local">个人单端</button><button class="mode-btn" data-mode="cloud">云端同步</button></div></section><section class="panel composer"><div><div class="panel-title" style="margin-bottom:15px">今天想说点什么？</div><textarea id="entryText" placeholder="写下此刻的心情，或者点击右侧开始语音记录……"></textarea><div id="preview" style="display:flex;gap:8px;flex-wrap:wrap"></div></div><div class="composer-tools"><button id="voiceBtn" class="tool-btn record">◉&nbsp; 按住说话</button><label class="tool-btn" for="photoInput">▧&nbsp; 从相册添加图片</label><input id="photoInput" class="file-input" type="file" accept="image/*" multiple><button id="saveBtn" class="save-btn">保存这篇日记</button></div></section></div>
    </main>
  </div>
  <div id="settingsModal" class="modal"><div class="modal-card"><h3>账户与密码</h3><p style="color:var(--muted);font-size:13px">二级密码拥有更高权限，可以修改一级密码；一级密码不能修改二级密码。</p><label>当前身份</label><div id="roleText" style="padding:10px;background:#f6f4ef;border-radius:10px">普通解锁（一级密码）</div><label>修改一级密码</label><input id="newPrimary" type="password" placeholder="输入新的一级密码"><div class="modal-actions"><button class="secondary" id="closeModal">取消</button><button class="primary" id="changePassword">保存修改</button></div></div></div>
  <script>
    const $=s=>document.querySelector(s); let current=new Date(2026,10,7), role='primary'; const key='quiet-pages-entries';
    const seed=[{date:'2026-11-07',time:'08:42',title:'晨光落在窗台',text:'今天起得很早，阳光从百叶窗的缝隙里落进来。泡了一杯热茶，突然觉得慢一点也没有关系。',tag:'生活',photo:null},{date:'2026-11-05',time:'21:18',title:'给未来的自己',text:'希望你看到这段话的时候，依然保有对新事物的好奇心。',tag:'随想',photo:null},{date:'2026-11-02',time:'18:03',title:'下班路上的风',text:'路过街角那家面包店，买了刚出炉的可颂。秋天的风是甜的。',tag:'日常',photo:null}]; let entries=JSON.parse(localStorage.getItem(key)||'null')||seed;
    function renderCalendar(){const y=current.getFullYear(),m=current.getMonth(), first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(); $('#monthLabel').textContent=`${y}年${m+1}月`; const marks=new Set(entries.map(e=>e.date)); let html=['日','一','二','三','四','五','六'].map(x=>`<div class="weekday">${x}</div>`).join(''); for(let i=0;i<first;i++)html+='<div class="day blank"></div>'; for(let d=1;d<=days;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`, sel=ds==='2026-11-07'; html+=`<button class="day ${marks.has(ds)?'has-entry':''} ${sel?'selected':''}" onclick="selectDate('${ds}')"><span class="day-num">${d}</span>${marks.has(ds)?'<i class="mark"></i>':''}</button>`} $('#calendarGrid').innerHTML=html}
    function renderEntries(){const recent=entries.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,3); $('#entries').innerHTML=recent.map(e=>`<article class="entry"><div class="entry-meta"><span>${e.date.replaceAll('-',' / ')} · ${e.time}</span><span>•••</span></div><div class="entry-title">${e.title}</div><div class="entry-excerpt">${e.text}</div><div class="entry-foot"><span class="tag">${e.tag||'记录'}</span>${e.photo?`<img class="media-thumb" src="${e.photo}">`:''}</div></article>`).join('')||'<div class="empty">还没有记录，写下第一篇吧。</div>'}
    function selectDate(ds){const e=entries.find(x=>x.date===ds); if(e){$('#entryText').value=e.text; window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}else alert(`${ds} 还没有记录。`)}
    let mode=localStorage.getItem('quiet-pages-mode')||'local';
    function save(){const text=$('#entryText').value.trim(); if(!text&&!window.photoData){alert('先写点什么，或添加一张图片吧。');return} const now=new Date(), date=now.toISOString().slice(0,10), time=now.toTimeString().slice(0,5); entries.unshift({date,time,title:text?text.slice(0,18):'一张照片',text:text||'今天留下了一张照片。',tag:'新记录',photo:window.photoData||null}); localStorage.setItem(key,JSON.stringify(entries)); $('#entryText').value=''; $('#preview').innerHTML=''; window.photoData=null; renderCalendar();renderEntries(); alert(mode==='cloud'?'已保存到本机同步队列；连接后端后会自动上传。':'已保存在本机。建议定期导出加密备份。')}
    function setMode(next){mode=next;localStorage.setItem('quiet-pages-mode',mode);document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('#modeHint').textContent=mode==='cloud'?'云端同步模式：当前为待连接状态，接入账户 API 后会自动上传并支持多设备。':'单端模式：只保存在本机，可随时导出加密备份。';$('.sync-card').innerHTML=mode==='cloud'?'<div class="sync-row"><span class="dot" style="background:#e6a05b"></span>等待云端接入</div><p>当前记录仍保存在本机<br>接入后自动上传</p>':'<div class="sync-row"><span class="dot"></span>仅本机保存</div><p>建议定期导出加密备份<br>换设备时手动导入</p>'}
    async function derive(pass,salt){return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),{name:'PBKDF2'},false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
    async function exportBackup(){const pass=prompt('为加密备份设置一个备份密码：');if(!pass)return;const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),keyObj=await derive(pass,salt),data=new TextEncoder().encode(JSON.stringify({version:1,createdAt:new Date().toISOString(),entries})),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},keyObj,data),blob=new Blob([JSON.stringify({salt:Array.from(salt),iv:Array.from(iv),data:Array.from(new Uint8Array(cipher))})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='quiet-pages-encrypted-backup.json';a.click();URL.revokeObjectURL(a.href)}
    async function importBackup(file){const pass=prompt('输入备份密码：');if(!pass)return;try{const pack=JSON.parse(await file.text()),keyObj=await derive(pass,new Uint8Array(pack.salt)),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(pack.iv)},keyObj,new Uint8Array(pack.data)),data=JSON.parse(new TextDecoder().decode(plain));if(!Array.isArray(data.entries))throw Error();entries=data.entries;localStorage.setItem(key,JSON.stringify(entries));renderCalendar();renderEntries();alert('备份已解密并导入本机。')}catch(e){alert('备份密码不正确，或文件已损坏。')}}
    $('#unlockBtn').onclick=()=>{const p=$('#passwordInput').value;if(['1234','2468'].includes(p)){role=p==='2468'?'secondary':'primary';$('#lockScreen').style.display='none';$('#roleText').textContent=role==='secondary'?'高级解锁（二级密码）':'普通解锁（一级密码）'}else alert('密码不正确，请再试一次。')}; $('#passwordInput').onkeydown=e=>{if(e.key==='Enter')$('#unlockBtn').click()}; $('#newBtn').onclick=()=>$('#entryText').focus(); $('#saveBtn').onclick=save; $('#prevMonth').onclick=()=>{current.setMonth(current.getMonth()-1);renderCalendar()}; $('#nextMonth').onclick=()=>{current.setMonth(current.getMonth()+1);renderCalendar()}; $('#settingsBtn').onclick=()=>$('#settingsModal').classList.add('show'); $('#closeModal').onclick=()=>$('#settingsModal').classList.remove('show'); $('#changePassword').onclick=()=>{if(role!=='secondary'){alert('只有二级密码可以修改一级密码。');return}if(!$('#newPrimary').value){alert('请输入新的一级密码。');return}alert('一级密码已更新（演示状态）。');$('#settingsModal').classList.remove('show')}; $('#photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{window.photoData=r.result;$('#preview').innerHTML=`<img src="${r.result}" style="width:72px;height:54px;object-fit:cover;border-radius:8px">`};r.readAsDataURL(f)}; document.querySelectorAll('.mode-btn').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('#exportBtn').onclick=exportBackup;$('#importBtn').onclick=()=>$('#backupInput').click();$('#backupInput').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0])};setMode(mode);
    let recognition; if('webkitSpeechRecognition' in window||'SpeechRecognition' in window){const R=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new R();recognition.lang='zh-CN';recognition.continuous=false;recognition.onresult=e=>{$('#entryText').value+=(($('#entryText').value?' ':'')+e.results[0][0].transcript)};recognition.onend=()=>$('#voiceBtn').classList.remove('recording')}; $('#voiceBtn').onclick=()=>{if(!recognition){alert('当前浏览器不支持语音识别，请使用最新版 Chrome 或 Edge。');return}$('#voiceBtn').classList.add('recording');recognition.start()}; renderCalendar();renderEntries();
  </script>
</body></html>
